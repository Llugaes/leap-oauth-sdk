[project]
name = "leap-oauth-sdk"
version = "0.5.0.dev3"
requires-python = ">=3.12"
description = "Business-side SDK for services that accept Leap Auth OAuth access tokens"
authors = [{name = "Llugaes", email = "249094896@qq.com"}]
license = {file = "LICENSE"}
readme = "README.md"
keywords = ["oauth", "jwt", "jwks", "access-token", "sso"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/Llugaes/leap-oauth-sdk"
Repository = "https://github.com/Llugaes/leap-oauth-sdk"
Issues = "https://github.com/Llugaes/leap-oauth-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "respx>=0.21",
    "pyright",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leap_oauth_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"testdata/feishu_native_v2_vectors.json" = "leap_oauth_sdk/testdata/feishu_native_v2_vectors.json"

[tool.hatch.build.targets.sdist]
only-include = ["src/leap_oauth_sdk", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml", "testdata/feishu_native_v2_vectors.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
strict = ["src"]
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
